name: Jabalpuriya News Aggregator & Netlify Auto-Deploy

on:
  schedule:
    # Run once a day at 01:30 UTC (7:00 AM IST - Morning News Edition)
    - cron: '30 1 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ⚙️ Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Dependencies
        run: |
          npm install --no-audit --no-fund

      - name: 📡 Execute Jabalpur RSS News Aggregator
        run: |
          node scripts/fetch-news.mjs

      - name: 🔍 Check for Data Updates
        id: git-check
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/news.json
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No new news articles found in this cycle."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Fresh Jabalpur news articles aggregated and staged."
          fi

      - name: 💾 Commit and Push Updated News Data
        if: steps.git-check.outputs.has_changes == 'true'
        run: |
          git commit -m "chore(news): auto-update Jabalpur news wire [skip ci]"
          git push origin main

      - name: 🚀 Trigger Netlify Build Hook (If Configured)
        if: steps.git-check.outputs.has_changes == 'true'
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -n "$NETLIFY_BUILD_HOOK" ]; then
            echo "Triggering Netlify build hook..."
            curl -s -X POST -d '{}' "$NETLIFY_BUILD_HOOK"
            echo "Netlify build triggered successfully."
          else
            echo "NETLIFY_BUILD_HOOK secret is not set; skipping webhook trigger."
          fi
