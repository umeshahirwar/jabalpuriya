name: Deploy Jabalpuriya to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # Run once a day at 01:30 UTC (7:00 AM IST - Morning News Edition)
    - cron: '30 1 * * *'
  workflow_dispatch: # Allows manual one-click trigger anytime from GitHub Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ⚙️ Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Dependencies
        run: npm install --no-audit --no-fund

      - name: 📡 Execute Jabalpur RSS News Aggregator (On Schedule or Manual)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/fetch-news.mjs

      - name: 🔍 Check for Data Updates
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        id: git-check
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/news.json
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No new news articles found in this cycle."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Fresh Jabalpur news articles aggregated and staged."
          fi

      - name: 💾 Commit and Push Updated News Data
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.git-check.outputs.has_changes == 'true'
        run: |
          git commit -m "chore(news): auto-update Jabalpur news wire"
          git push origin main

      - name: 🛠️ Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: 🏗️ Build Static Site with Astro
        env:
          ASTRO_TELEMETRY_DISABLED: 1
        run: npm run build

      - name: 📤 Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
